name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ros_distro: noetic
            ros_version: "1"
            image: ros:noetic-ros-base-focal
          - ros_distro: humble
            ros_version: "2"
            image: ros:humble-ros-base-jammy
          - ros_distro: iron
            ros_version: "2"
            image: ros:iron-ros-base-jammy
          - ros_distro: jazzy
            ros_version: "2"
            image: ros:jazzy-ros-base-noble
          - ros_distro: rolling
            ros_version: "2"
            image: ros:rolling-ros-base-noble

    container:
      image: ${{ matrix.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare workspace
        run: |
          mkdir -p /ros_ws/src
          cp -r $GITHUB_WORKSPACE /ros_ws/src/robot_description_generator

      - name: Install dependencies
        run: |
          apt-get update -qq
          if [ "${{ matrix.ros_version }}" = "1" ]; then
            apt-get install -y -qq python3-catkin-tools
          fi
          apt-get install -y -qq liburdfdom-dev liburdfdom-headers-dev libyaml-cpp-dev
          rosdep update --include-eol-distros
          rosdep install --from-paths /ros_ws/src --ignore-src -y --skip-keys "urdfdom urdfdom_headers"
        env:
          ROS_DISTRO: ${{ matrix.ros_distro }}

      - name: Build (ROS 1)
        if: matrix.ros_version == '1'
        shell: bash
        run: |
          . /opt/ros/${{ matrix.ros_distro }}/setup.sh
          cd /ros_ws
          catkin build -DCMAKE_BUILD_TYPE=Release
        env:
          ROS_DISTRO: ${{ matrix.ros_distro }}
          ROS_VERSION: "1"

      - name: Test (ROS 1)
        if: matrix.ros_version == '1'
        shell: bash
        run: |
          . /opt/ros/${{ matrix.ros_distro }}/setup.sh
          . /ros_ws/devel/setup.sh
          cd /ros_ws && catkin test --no-deps
        env:
          ROS_DISTRO: ${{ matrix.ros_distro }}

      - name: Build (ROS 2)
        if: matrix.ros_version == '2'
        shell: bash
        run: |
          . /opt/ros/${{ matrix.ros_distro }}/setup.bash
          cd /ros_ws
          colcon build --packages-select robot_description_generator --cmake-args -DCMAKE_BUILD_TYPE=Release
        env:
          ROS_DISTRO: ${{ matrix.ros_distro }}
          ROS_VERSION: "2"

      - name: Test (ROS 2)
        if: matrix.ros_version == '2'
        shell: bash
        run: |
          . /opt/ros/${{ matrix.ros_distro }}/setup.bash
          . /ros_ws/install/setup.bash
          cd /ros_ws && colcon test --packages-select robot_description_generator
          colcon test-result --verbose
        env:
          ROS_DISTRO: ${{ matrix.ros_distro }}
